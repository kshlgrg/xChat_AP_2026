<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="100%" height="100%" style="background:#0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="crow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 12 6 L 0 11 M 12 1 L 12 11" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    </marker>
    <style>
      .hdr { font-size: 14px; font-weight: bold; fill: #ffffff; }
      .col { font-size: 12px; fill: #e2e8f0; }
      .key { font-size: 10px; font-weight: bold; fill: #fbbf24; }
      .typ { font-size: 11px; fill: #94a3b8; }
      .rel { stroke: #475569; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Banner -->
  <rect x="40" y="20" width="1520" height="55" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="55" fill="#38bdf8" font-size="20" font-weight="bold">xChat Enterprise Messaging Platform — Relational ER Architecture (BCNF)</text>
  <text x="1320" y="55" fill="#94a3b8" font-size="14">Author: Kushal Garg · AP 2026</text>

  <!-- Users (50, 110) -->
  <g transform="translate(50, 110)" filter="url(#shadow)">
    <rect width="240" height="220" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="240" height="32" rx="6" fill="#1d4ed8"/>
    <text x="15" y="22" class="hdr">users</text>
    <text x="15" y="55" class="key">PK</text><text x="38" y="55" class="col">user_id</text><text x="165" y="55" class="typ">INT</text>
    <text x="15" y="78" class="key">UK</text><text x="38" y="78" class="col">username</text><text x="165" y="78" class="typ">VARCHAR</text>
    <text x="15" y="101" class="key">UK</text><text x="38" y="101" class="col">email</text><text x="165" y="101" class="typ">VARCHAR</text>
    <text x="38" y="124" class="col">password_hash</text><text x="165" y="124" class="typ">VARCHAR</text>
    <text x="38" y="147" class="col">display_name</text><text x="165" y="147" class="typ">VARCHAR</text>
    <text x="38" y="170" class="col">created_at</text><text x="165" y="170" class="typ">TIMESTAMPTZ</text>
    <text x="38" y="193" class="col">last_seen_at</text><text x="165" y="193" class="typ">TIMESTAMPTZ</text>
  </g>

  <!-- User Presence (50, 370) -->
  <g transform="translate(50, 370)" filter="url(#shadow)">
    <rect width="240" height="135" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="240" height="32" rx="6" fill="#1d4ed8"/>
    <text x="15" y="22" class="hdr">user_presence (1:1)</text>
    <text x="15" y="55" class="key">PK,FK</text><text x="55" y="55" class="col">user_id</text><text x="165" y="55" class="typ">INT</text>
    <text x="38" y="78" class="col">status</text><text x="165" y="78" class="typ">VARCHAR</text>
    <text x="38" y="101" class="col">custom_status</text><text x="165" y="101" class="typ">VARCHAR</text>
    <text x="38" y="124" class="col">updated_at</text><text x="165" y="124" class="typ">TIMESTAMPTZ</text>
  </g>

  <!-- Workspaces (370, 110) -->
  <g transform="translate(370, 110)" filter="url(#shadow)">
    <rect width="240" height="160" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
    <rect width="240" height="32" rx="6" fill="#0891b2"/>
    <text x="15" y="22" class="hdr">workspaces</text>
    <text x="15" y="55" class="key">PK</text><text x="38" y="55" class="col">workspace_id</text><text x="165" y="55" class="typ">INT</text>
    <text x="38" y="78" class="col">name</text><text x="165" y="78" class="typ">VARCHAR</text>
    <text x="15" y="101" class="key">UK</text><text x="38" y="101" class="col">slug</text><text x="165" y="101" class="typ">VARCHAR</text>
    <text x="15" y="124" class="key">FK</text><text x="38" y="124" class="col">owner_id</text><text x="165" y="124" class="typ">INT</text>
    <text x="38" y="147" class="col">created_at</text><text x="165" y="147" class="typ">TIMESTAMPTZ</text>
  </g>

  <!-- Workspace Members (370, 320) -->
  <g transform="translate(370, 320)" filter="url(#shadow)">
    <rect width="240" height="140" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
    <rect width="240" height="32" rx="6" fill="#0891b2"/>
    <text x="15" y="22" class="hdr">workspace_members</text>
    <text x="15" y="55" class="key">PK,FK</text><text x="55" y="55" class="col">workspace_id</text><text x="165" y="55" class="typ">INT</text>
    <text x="15" y="78" class="key">PK,FK</text><text x="55" y="78" class="col">user_id</text><text x="165" y="78" class="typ">INT</text>
    <text x="38" y="101" class="col">role</text><text x="165" y="101" class="typ">VARCHAR</text>
    <text x="38" y="124" class="col">joined_at</text><text x="165" y="124" class="typ">TIMESTAMPTZ</text>
  </g>

  <!-- Channels (690, 110) -->
  <g transform="translate(690, 110)" filter="url(#shadow)">
    <rect width="240" height="190" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect width="240" height="32" rx="6" fill="#059669"/>
    <text x="15" y="22" class="hdr">channels</text>
    <text x="15" y="55" class="key">PK</text><text x="38" y="55" class="col">channel_id</text><text x="165" y="55" class="typ">INT</text>
    <text x="15" y="78" class="key">FK</text><text x="38" y="78" class="col">workspace_id</text><text x="165" y="78" class="typ">INT</text>
    <text x="38" y="101" class="col">name</text><text x="165" y="101" class="typ">VARCHAR</text>
    <text x="38" y="124" class="col">topic</text><text x="165" y="124" class="typ">TEXT</text>
    <text x="38" y="147" class="col">is_private</text><text x="165" y="147" class="typ">BOOLEAN</text>
    <text x="15" y="170" class="key">FK</text><text x="38" y="170" class="col">created_by</text><text x="165" y="170" class="typ">INT</text>
  </g>

  <!-- Channel Members (690, 340) -->
  <g transform="translate(690, 340)" filter="url(#shadow)">
    <rect width="240" height="165" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect width="240" height="32" rx="6" fill="#059669"/>
    <text x="15" y="22" class="hdr">channel_members</text>
    <text x="15" y="55" class="key">PK,FK</text><text x="55" y="55" class="col">channel_id</text><text x="165" y="55" class="typ">INT</text>
    <text x="15" y="78" class="key">PK,FK</text><text x="55" y="78" class="col">user_id</text><text x="165" y="78" class="typ">INT</text>
    <text x="38" y="101" class="col">role</text><text x="165" y="101" class="typ">VARCHAR</text>
    <text x="38" y="124" class="col">joined_at</text><text x="165" y="124" class="typ">TIMESTAMPTZ</text>
    <text x="38" y="147" class="col">last_read_msg_id</text><text x="165" y="147" class="typ">INT</text>
  </g>

  <!-- Direct Conversations (50, 560) -->
  <g transform="translate(50, 560)" filter="url(#shadow)">
    <rect width="240" height="140" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect width="240" height="32" rx="6" fill="#7c3aed"/>
    <text x="15" y="22" class="hdr">direct_conversations</text>
    <text x="15" y="55" class="key">PK</text><text x="38" y="55" class="col">conversation_id</text><text x="165" y="55" class="typ">INT</text>
    <text x="15" y="78" class="key">FK</text><text x="38" y="78" class="col">user1_id</text><text x="165" y="78" class="typ">INT</text>
    <text x="15" y="101" class="key">FK</text><text x="38" y="101" class="col">user2_id</text><text x="165" y="101" class="typ">INT</text>
    <text x="38" y="124" class="col">created_at</text><text x="165" y="124" class="typ">TIMESTAMPTZ</text>
  </g>

  <!-- Messages (1010, 110) -->
  <g transform="translate(1010, 110)" filter="url(#shadow)">
    <rect width="270" height="280" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="270" height="32" rx="6" fill="#d97706"/>
    <text x="15" y="22" class="hdr">messages</text>
    <text x="15" y="55" class="key">PK</text><text x="38" y="55" class="col">message_id</text><text x="180" y="55" class="typ">INT</text>
    <text x="15" y="78" class="key">FK</text><text x="38" y="78" class="col">channel_id (null)</text><text x="180" y="78" class="typ">INT</text>
    <text x="15" y="101" class="key">FK</text><text x="38" y="101" class="col">conversation_id</text><text x="180" y="101" class="typ">INT</text>
    <text x="15" y="124" class="key">FK</text><text x="38" y="124" class="col">sender_id</text><text x="180" y="124" class="typ">INT</text>
    <text x="15" y="147" class="key">FK</text><text x="38" y="147" class="col">parent_msg_id</text><text x="180" y="147" class="typ">INT</text>
    <text x="38" y="170" class="col">content</text><text x="180" y="170" class="typ">TEXT</text>
    <text x="38" y="193" class="col">message_type</text><text x="180" y="193" class="typ">VARCHAR</text>
    <text x="38" y="216" class="col">is_edited</text><text x="180" y="216" class="typ">BOOLEAN</text>
    <text x="38" y="239" class="col">is_pinned</text><text x="180" y="239" class="typ">BOOLEAN</text>
    <text x="38" y="262" class="col">created_at</text><text x="180" y="262" class="typ">TIMESTAMPTZ</text>
  </g>

  <!-- Attachments (1340, 110) -->
  <g transform="translate(1340, 110)" filter="url(#shadow)">
    <rect width="220" height="180" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
    <rect width="220" height="32" rx="6" fill="#db2777"/>
    <text x="15" y="22" class="hdr">attachments</text>
    <text x="15" y="55" class="key">PK</text><text x="38" y="55" class="col">attachment_id</text><text x="150" y="55" class="typ">INT</text>
    <text x="15" y="78" class="key">FK</text><text x="38" y="78" class="col">message_id</text><text x="150" y="78" class="typ">INT</text>
    <text x="38" y="101" class="col">file_name</text><text x="150" y="101" class="typ">VARCHAR</text>
    <text x="38" y="124" class="col">file_url</text><text x="150" y="124" class="typ">TEXT</text>
    <text x="38" y="147" class="col">file_size_bytes</text><text x="150" y="147" class="typ">BIGINT</text>
    <text x="38" y="170" class="col">mime_type</text><text x="150" y="170" class="typ">VARCHAR</text>
  </g>

  <!-- Reactions (1010, 440) -->
  <g transform="translate(1010, 440)" filter="url(#shadow)">
    <rect width="250" height="140" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
    <rect width="250" height="32" rx="6" fill="#e11d48"/>
    <text x="15" y="22" class="hdr">reactions</text>
    <text x="15" y="55" class="key">PK,FK</text><text x="55" y="55" class="col">message_id</text><text x="165" y="55" class="typ">INT</text>
    <text x="15" y="78" class="key">PK,FK</text><text x="55" y="78" class="col">user_id</text><text x="165" y="78" class="typ">INT</text>
    <text x="15" y="101" class="key">PK</text><text x="38" y="101" class="col">emoji_code</text><text x="165" y="101" class="typ">VARCHAR</text>
    <text x="38" y="124" class="col">reacted_at</text><text x="165" y="124" class="typ">TIMESTAMPTZ</text>
  </g>

  <!-- Relations -->
  <!-- users -> workspaces -->
  <path d="M 290 160 L 370 160" class="rel" marker-end="url(#crow)"/>
  <!-- users -> workspace_members -->
  <path d="M 290 220 L 330 220 L 330 360 L 370 360" class="rel" marker-end="url(#crow)"/>
  <!-- workspaces -> workspace_members -->
  <path d="M 490 270 L 490 320" class="rel" marker-end="url(#crow)"/>
  <!-- workspaces -> channels -->
  <path d="M 610 160 L 690 160" class="rel" marker-end="url(#crow)"/>
  <!-- channels -> channel_members -->
  <path d="M 810 300 L 810 340" class="rel" marker-end="url(#crow)"/>
  <!-- channels -> messages -->
  <path d="M 930 160 L 1010 160" class="rel" marker-end="url(#crow)"/>
  <!-- direct_conversations -> messages -->
  <path d="M 290 620 L 1100 620 L 1100 390" class="rel" marker-end="url(#crow)"/>
  <!-- messages -> attachments -->
  <path d="M 1280 160 L 1340 160" class="rel" marker-end="url(#crow)"/>
  <!-- messages -> reactions -->
  <path d="M 1120 390 L 1120 440" class="rel" marker-end="url(#crow)"/>
  <!-- users -> user_presence -->
  <path d="M 170 330 L 170 370" class="rel" marker-end="url(#crow)"/>

</svg>